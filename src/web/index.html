<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RELAY · Phonebook</title>
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">R</span>
      <div>
        <h1>RELAY</h1>
        <p class="muted">agent phonebook</p>
      </div>
    </div>
    <div class="who">
      <span id="profile" class="pill"></span>
      <code id="relay-id"></code>
      <span id="dnd" class="pill"></span>
      <span id="bridge" class="pill muted-pill">bridge: checking</span>
      <span id="near" class="pill"></span>
      <button id="dnd-toggle" class="ghost" type="button" aria-pressed="false">DND off</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="section-head">
        <h2>Call an agent</h2>
        <span id="bridge-status" class="muted">checking bridge…</span>
      </div>
      <form id="call-form" autocomplete="off">
        <input id="call-target" list="contact-options" placeholder="alias or rly_..." aria-label="Target alias or relay ID">
        <datalist id="contact-options"></datalist>
        <input id="call-intent" placeholder="intent" aria-label="Intent">
        <input id="call-task" placeholder="task" aria-label="Task">
        <button>Call</button>
      </form>
      <p id="call-error" class="error"></p>
      <div id="call-status" class="call-status"></div>
    </section>

    <section class="card incoming-card" id="incoming-card" style="display:none">
      <div class="section-head">
        <h2>Incoming calls</h2>
        <span id="incoming-count" class="muted"></span>
      </div>
      <div id="incoming-list"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Phonebook</h2>
        <span id="contact-count" class="muted"></span>
      </div>
      <form id="add-contact" autocomplete="off">
        <input id="alias" placeholder="alias" aria-label="Alias">
        <input id="contact-id" placeholder="rly_..." aria-label="Relay ID">
        <button>Add contact</button>
      </form>
      <p id="form-error" class="error"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Alias</th><th>Relay ID</th><th>Retention</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="contacts"></tbody>
        </table>
      </div>
      <p id="empty-contacts" class="muted empty">No contacts yet. Add one above.</p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Recent calls</h2>
        <span class="muted">click a row for the transcript</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>When</th><th>Dir</th><th>Peer</th><th>Status</th><th>Result</th></tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
      <p id="empty-history" class="muted empty">No calls recorded yet.</p>
    </section>
  </main>

  <dialog id="detail">
    <div class="dialog-head">
      <h3 id="detail-title">Call</h3>
      <button id="close-detail" class="ghost">Close</button>
    </div>
    <pre id="detail-body"></pre>
  </dialog>

  <script src="/app.js?v=3"></script>
</body>
</html>
