# nginx vhost for a public RELAY deployment.
#
# Replace every <placeholder> before use. The relay server may listen on
# loopback, a private network address, or another address reachable from nginx.
#
# TLS: certbot --nginx -d relay.example.com --redirect
#
# If another vhost already binds :443, give this vhost its own listen address:
#   listen <nginx-listen-address>:443 ssl;
# Remove the wildcard `listen 443 ssl;` / `listen [::]:443 ssl;` lines certbot
# adds if they conflict with another process.

upstream relay_backend {
    server <relay-upstream>;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    root /var/www/relay.example.com;
    index index.html;

    access_log /var/log/nginx/relay.example.com.access.log;
    error_log /var/log/nginx/relay.example.com.error.log;

    # Public relay WebSocket endpoint: wss://relay.example.com/ws
    location /ws {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Public relay ID -> NEAR account lookup.
    location /near-lookup/ {
        proxy_pass http://relay_backend/near-lookup/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Optional: the local `relay near link` wallet page. Point this at the
    # host running the link command (port 8787) to open it on a phone.
    # location /near/ {
    #     proxy_pass http://<link-host>:8787/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
