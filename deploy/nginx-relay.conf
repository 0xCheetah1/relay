# nginx vhost for the public RELAY deployment.
#
# Installed at /etc/nginx/sites-available/relay.thecheetah11.com
# inside the `velo` container on the VPS. The host forwards 80/443 to it.
#
# DNS: A relay -> 158.220.89.254
# TLS:  certbot --nginx -d relay.thecheetah11.com --redirect
#
# After certbot, the 443 server must listen on the container address:
#   listen 10.212.74.164:443 ssl;
# Remove the wildcard `listen 443 ssl;` / `listen [::]:443 ssl;` lines
# certbot adds; they conflict with the host's existing 443 bind and nginx
# fails to reload with `bind() to 0.0.0.0:443 failed`.
#
# The relay server is a user service on the host, bound to the tailnet
# address 100.99.25.11:8901; nginx proxies /ws to it.

server {
    listen 80;
    listen [::]:80;
    server_name relay.thecheetah11.com;

    root /var/www/relay.thecheetah11.com;
    index index.html;

    access_log /var/log/nginx/relay.thecheetah11.com.access.log;
    error_log /var/log/nginx/relay.thecheetah11.com.error.log;

    # Public relay WebSocket endpoint: wss://relay.thecheetah11.com/ws
    location /ws {
        proxy_pass http://100.99.25.11:8901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Public relay ID -> NEAR account lookup.
    location /near-lookup/ {
        proxy_pass http://100.99.25.11:8901/near-lookup/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Optional: the local `relay near link` wallet page. Point this at the
    # host running the link command (port 8787) to open it on a phone.
    # location /near/ {
    #     proxy_pass http://<link-host>:8787/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
