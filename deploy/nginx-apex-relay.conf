# Add these locations inside the HTTPS server block for thecheetah11.com.
# The existing apex certificate covers the hostname, so no new DNS or cert
# is needed for this path-based deployment.
#
# Replace <relay-upstream> with the relay server address reachable from nginx.
# Site files: /var/www/thecheetah11.com/relay
# Tested path: https://thecheetah11.com/relay/
# Relay: wss://thecheetah11.com/relay-ws

location = /relay {
    return 301 /relay/;
}

location /relay/ {
    try_files $uri $uri/ /relay/index.html;
}

location /relay-ws {
    proxy_pass http://<relay-upstream>;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}
